version: "3.9"

# Gedeelde backend-omgeving voor web-, worker- en scheduler-container.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-ledenportaal}
  DB_USERNAME: ${DB_USERNAME:-app}
  DB_PASSWORD: ${DB_PASSWORD}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}
  STRIPE_SECRET: ${STRIPE_SECRET}
  STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
  STRIPE_CONNECT_ACCOUNT_TYPE: ${STRIPE_CONNECT_ACCOUNT_TYPE:-express}
  STRIPE_DEFAULT_CURRENCY: ${STRIPE_DEFAULT_CURRENCY:-eur}
  STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC}
  STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS}
  STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: leden_backend:latest
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coolify

  # Queue-worker: verwerkt ShouldQueue-jobs (o.a. push-notificaties) buiten de request.
  worker:
    image: leden_backend:latest
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    networks:
      - coolify

  # Scheduler: draait de geplande commands (o.a. subscriptions:check-incomplete).
  scheduler:
    image: leden_backend:latest
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    networks:
      - coolify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  backend_storage:
